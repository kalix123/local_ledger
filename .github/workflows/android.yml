# Builds the Android APK on GitHub's runners.
#
#   push / pull request  → run tests, build a release APK, attach it to the run as an artifact
#   push a tag "v1.2.3"  → same, plus publish a GitHub release with both APKs, notes from the
#                          fastlane changelog and checksums (needs the signing secrets below)
#   "Run workflow" button → same as a push (Actions tab → Android build → Run workflow)
#
# Stage 1 (Expo): `expo prebuild` generates the android/ project from app.json and plugins/.
# Stage 2 (Gradle): `gradlew assembleRelease` compiles it into an APK.
#
# Output: local-ledger-<version>-arm64-v8a.apk (almost every phone) and -armeabi-v7a.apk (older
# 32-bit phones).
#
# Signing: add these repository secrets (Settings → Secrets and variables → Actions) to sign
# with your own release key. Without them the APK is signed with the public debug key, which is
# fine for testing but not for publishing, so tag builds stop without them.
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to create the GitHub release on tag pushes
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Read app version
        id: version
        run: |
          echo "name=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
          echo "code=$(node -p "require('./app.json').expo.android.versionCode")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches app.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.name }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app.json version ${{ steps.version.outputs.name }}"
            exit 1
          fi

      # A release signed with the public debug key can't be upgraded to one signed with your real
      # key later (Android makes people uninstall first, losing their data), so refuse.
      - name: Require the release key for releases
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Releases must be signed with your own key. Add the ANDROID_KEYSTORE_* secrets (see the top of this file) and re-run."
          exit 1

      - run: npm ci

      - name: Generate the Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # One APK per processor type (ABI), so each carries a single copy of the native libraries.
      # arm64-v8a covers practically every phone from the last several years; armeabi-v7a is for
      # older 32-bit phones. x86/x86_64 (emulators, a few Chromebooks) are left out.
      - name: Compile release APKs (Gradle), one per processor type
        working-directory: android
        run: |
          mkdir -p ../dist
          for abi in arm64-v8a armeabi-v7a; do
            ./gradlew assembleRelease -PreactNativeArchitectures=$abi
            cp app/build/outputs/apk/release/app-release.apk "../dist/local-ledger-${{ steps.version.outputs.name }}-$abi.apk"
          done

      - name: Sign with the release key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in dist/*.apk; do
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              "$apk"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk"
          done
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Warn when using the debug key
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so these APKs are signed with the debug key. Fine for testing, not for publishing."

      # Writes a size table for each APK (by top-level folder, compressed bytes) to the run summary.
      - name: Report APK sizes
        run: |
          {
            for apk in dist/*.apk; do
              echo "### $(basename "$apk"): $(du -h "$apk" | cut -f1)"
              echo
              echo "| Part | Size in APK |"
              echo "|---|---:|"
              # unzip -v columns: 1 = uncompressed size, 3 = size in APK, 8 = path
              unzip -v "$apk" \
                | awk '$1 ~ /^[0-9]+$/ && NF >= 8 {
                    n = split($8, p, "/")
                    key = (p[1] == "lib" && n > 2) ? p[1] "/" p[2] : (n > 1 ? p[1] "/" : p[1])
                    size[key] += $3
                  }
                  END { for (k in size) printf "%d %s\n", size[k], k }' \
                | sort -rn | head -12 \
                | awk '{ printf "| %s | %.1f MB |\n", $2, $1 / 1048576 }'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: local-ledger-${{ steps.version.outputs.name }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CHANGELOG: fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt
        run: |
          {
            printf '## What%ss new\n\n' "'"
            if [ -f "$CHANGELOG" ]; then cat "$CHANGELOG"; else echo "See the commits below."; fi
            printf '\n\n## Which file do I download?\n\n'
            printf '| File | For |\n|---|---|\n'
            printf '| `local-ledger-%s-arm64-v8a.apk` | Almost every Android phone from the last several years. **Pick this one if unsure.** |\n' "$VERSION"
            printf '| `local-ledger-%s-armeabi-v7a.apk` | Older 32-bit phones. Use it if the other one says "App not installed". |\n\n' "$VERSION"
            printf 'Open the APK on your phone and allow installing from your browser or file manager when Android asks.\n\n'
            printf 'Local Ledger asks for no permissions at all, not even internet access. Your data never leaves your phone.\n\n'
            printf 'SHA-256 checksums:\n\n```\n'
            (cd dist && sha256sum *.apk)
            printf '```\n'
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Local Ledger ${{ steps.version.outputs.name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: dist/*.apk
          generate_release_notes: true
